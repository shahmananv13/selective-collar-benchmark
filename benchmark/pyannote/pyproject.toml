[project]
name = "selcollar-pyannote"
version = "0.1.0"
description = "pyannote/speaker-diarization-3.1 RTTM runner for the selective-collar benchmark."
requires-python = ">=3.12,<3.13"
dependencies = [
    # RTX 50xx / Blackwell needs CUDA 12.8 wheels -> cu128 index below
    "torch==2.11.0",
    "torchaudio==2.11.0",
    # 3.x line the 3.1 pipeline was released for; sibling packages pinned to the same era
    "pyannote.audio==3.3.2",
    "pyannote.core==5.0.0",
    "pyannote.database==5.1.3",
    "pyannote.pipeline==3.0.1",
    "pyannote.metrics==3.2.1",
    "huggingface_hub==0.36.2",   # <1.0: pyannote.audio 3.x passes use_auth_token
    "lightning==2.6.6",
    "speechbrain==1.1.2",
    "scikit-learn==1.8.0",       # 1.9.x compiled wheels are blocked by Windows Smart App Control
    "numpy==2.5.4",
    "scipy==1.18.1",
    "matplotlib==3.11.2",        # imported by pyannote.audio 3.3.2 tasks
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
