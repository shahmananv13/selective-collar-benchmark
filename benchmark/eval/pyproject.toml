[project]
name = "selcollar-eval"
version = "0.1.0"
description = "Evaluation harness: No Collar / Traditional Collar / Selective Collar benchmark across diarization systems"
requires-python = ">=3.12,<3.13"
dependencies = [
    # same versions as the public selective_collar repo (requirements.txt)
    "pyannote.core==6.0.1",
    "pyannote.metrics==4.0.0",
    "numpy>=2.0,<2.5",
    "scipy>=1.13,<1.17",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<3.11",
    # Windows Smart App Control blocked scikit-learn 1.9.x wheels on this machine
    "scikit-learn>=1.5,<1.9",
    # DiarizationMetricInOne (dscore-ovl / CDER_Metric / BER) runtime deps
    "intervaltree>=3.0.0",
    "tabulate>=0.9.0",
    "typing_extensions>=4.12",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
