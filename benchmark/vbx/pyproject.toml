[project]
name = "selcollar-vbx"
version = "0.1.0"
description = "BUT VBx (energy VAD + ResNet101 16 kHz x-vectors + AHC + VB-HMM) RTTM runner for the selective-collar benchmark."
requires-python = ">=3.12,<3.13"
dependencies = [
    # RTX 50xx / Blackwell needs CUDA 12.8+ wheels -> cu128 index below
    "torch==2.11.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "h5py==3.16.0",
    "fastcluster==1.3.0",
    "kaldi_io==0.9.8",
    "numexpr==2.14.2",
]

[project.optional-dependencies]
# Only needed for `run_vbx.py --backend onnx` (slower: final.onnx has a fixed batch size of 1).
# onnxruntime-gpu 1.32 is built against CUDA 13 and uses the system CUDA 13 toolkit DLLs.
onnx = ["onnxruntime-gpu==1.32.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
